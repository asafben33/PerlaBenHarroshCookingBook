<?xml version="1.0" encoding="UTF-8"?>
<!--
  Perla Ben-Harrosh Cookbook — book cover leather texture (v8.29)
  Procedural leather grain + subtle color variation + vignette.
  Designed to layer over the existing linear-gradient brown base.
  Matches site palette (#4a2818 → #2e1808).
  ~5 KB, vector — scales crisply on retina displays.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Fine leather grain: two layers of turbulence blended -->
    <filter id="leather-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.29
                             0 0 0 0 0.16
                             0 0 0 0 0.08
                             0 0 0 0.35 0"/>
    </filter>
    <!-- Coarser pore pattern: sparser, darker specks -->
    <filter id="leather-pores" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.18" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.12
                             0 0 0 0 0.06
                             0 0 0 0 0.03
                             0 0 0 0.28 -0.1"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- Radial vignette — edges slightly darker than center -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0%"  stop-color="#4a2818" stop-opacity="0"/>
      <stop offset="65%" stop-color="#2a1408" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#180a04" stop-opacity="0.55"/>
    </radialGradient>
    <!-- Diagonal light sheen from upper-left -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7a4020" stop-opacity="0.35"/>
      <stop offset="35%"  stop-color="#5a2c14" stop-opacity="0.12"/>
      <stop offset="70%"  stop-color="#2e1808" stop-opacity="0"/>
    </linearGradient>
    <!-- Base warm-brown leather color -->
    <linearGradient id="base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#5a3020"/>
      <stop offset="50%" stop-color="#3e1f10"/>
      <stop offset="100%" stop-color="#2a140a"/>
    </linearGradient>
    <!-- Inner frame glow (subtle gold line inside the leather) -->
    <linearGradient id="frame-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#c4930a" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#c4930a" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#c4930a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c4930a" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- 1. Base warm leather color -->
  <rect width="100%" height="100%" fill="url(#base)"/>

  <!-- 2. Fine grain (all over) -->
  <rect width="100%" height="100%" filter="url(#leather-grain)" opacity="0.55"/>

  <!-- 3. Coarser pores on top -->
  <rect width="100%" height="100%" filter="url(#leather-pores)" opacity="0.45"/>

  <!-- 4. Diagonal light sheen (upper-left catches the light) -->
  <rect width="100%" height="100%" fill="url(#sheen)"/>

  <!-- 5. Radial vignette (darker at edges) -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>

  <!-- 6. Very subtle gold inner-frame hint at the edges -->
  <rect x="18" y="24" width="364" height="512" fill="none"
        stroke="url(#frame-glow)" stroke-width="0.8" opacity="0.6"/>
</svg>
